<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Le favicon. Next.js sert automatiquement `app/icon.svg` comme icone
    d'onglet — aucun lien a declarer.

    ┌────────────────────────────────────────────────────────────────────┐
    │  ICI, ET SEULEMENT ICI, la marque a un FOND.                       │
    └────────────────────────────────────────────────────────────────────┘

    Dans l'application elle se pose a nu sur la page, et sa teinte suit le
    fond. Un onglet de navigateur n'offre pas ce choix : il est clair chez les
    uns, sombre chez les autres, et la marque doit tenir dans les deux. Elle
    emporte donc son propre fond violet — ce qui est aussi la facon dont la
    reference se presente : forme claire sur champ sombre.

    Il est AUTONOME : son degrade est defini ici et non dans `app/layout.tsx`
    comme celui de `LogoKoli`. Un favicon est charge comme un document a part,
    hors de toute page ; il n'aurait vu aucune definition posee ailleurs, et se
    serait affiche transparent.

    Toute retouche du dessin doit etre reportee dans
    `components/ui/LogoKoli.tsx` et dans `app/apple-icon.png` — trois fichiers
    pour une seule marque, c'est le prix d'icones autonomes.
  -->
  <defs>
    <linearGradient id="fav-marque" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d4e2"/>
    </linearGradient>
  </defs>

  <!-- Le champ. `rx` genereux : a 16 px dans un onglet, un carre franc parait
       plus lourd que la marque qu'il porte. -->
  <rect width="100" height="100" rx="26" fill="#3e0d33"/>

  <!-- L'anneau et le comma, reduits a 78 % et recentres : a pleine taille,
       les bouts ronds toucheraient le bord du champ. -->
  <g transform="translate(11 11) scale(0.78)"
     fill="none" stroke="url(#fav-marque)" stroke-linecap="round">
    <path d="M74 32C66 22 54 18 44 22C29 28 24 47 32 61C40 75 58 80 70 72" stroke-width="17"/>
    <path d="M48 47C54 44 61 46 64 52" stroke-width="13"/>
  </g>
</svg>
